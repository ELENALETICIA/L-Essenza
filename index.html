<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="estilos.css">
        <title>L’Essenza</title>
    </head>
      <body>
        <header>
           <H1>L’Essenza</H1>
        </header>
        <main class=" hero-login">
            <section class="tarjeta-login animar-entrada"> <!--Bloque de login-->
                <h2 style="margin-bottom: 5px; text-align: center;">Acceso clientes</h2>
                <form action="inicio.html" method="get">
                    <fieldset>
                    <legend> Por favor, introduce tus credenciales de usuario</legend>
                   
                    <div class="campo">
                        <label for="correo">Correo Electronico</label>
                        <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                    </div>
                   
                     <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                    </div>
                       
                    <button type="submit" class="boton-enviar">Ingrese al Sitio</button>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 L’Essenza. Todos los derechos reservados.</p>
        </footer>








    </body>
</html>
